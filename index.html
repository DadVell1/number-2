<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Command Center</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1f2937; /* Consistent background */
            color: #f9fafb;
        }

        nav {
            background-color: #111827;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            margin: 0;
            font-size: 20px;
        }

        nav a {
            color: #f9fafb;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #3b82f6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #374151;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="number"] {
            padding: 8px;
            border-radius: 4px;
            border: none;
            flex: 1;
        }

        button {
            padding: 8px 16px;
            background-color: #3b82f6;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563eb;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #4b5563;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        .error {
            color: #f87171;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <h1>Inventory Command Center</h1>
        <div>
            <a href="index.html">Dashboard</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <div class="container">
        <h2>Warehouse Inventory</h2>

        <div id="errorMessage" class="error"></div>

        <form id="inventoryForm">
            <input type="text" id="itemName" placeholder="Item Name" required>
            <input type="number" id="quantity" placeholder="Quantity" min="0" required>
            <button type="submit">Add Item</button>
        </form>

        <ul id="inventoryList"></ul>
        <h3>Inventory Visualization</h3>
<canvas id="inventoryChart"></canvas>

    </div>

  <script>
const form = document.getElementById('inventoryForm');
const itemNameInput = document.getElementById('itemName');
const quantityInput = document.getElementById('quantity');
const inventoryList = document.getElementById('inventoryList');
const errorMessage = document.getElementById('errorMessage');

let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
let chart;

function saveInventory() {
    localStorage.setItem('inventory', JSON.stringify(inventory));
}

function renderInventory() {
    inventoryList.innerHTML = '';

    inventory.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
            <span>${item.name}</span>
            <span>Qty: ${item.quantity}</span>
        `;
        inventoryList.appendChild(li);
    });

    updateChart();
}

function isDuplicate(name) {
    return inventory.some(item =>
        item.name.toLowerCase() === name.toLowerCase()
    );
}

function updateChart() {
    const labels = inventory.map(item => item.name);
    const data = inventory.map(item => item.quantity);

    const ctx = document.getElementById('inventoryChart').getContext('2d');

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Item Quantity',
                data: data
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

form.addEventListener('submit', function(e) {
    e.preventDefault();

    const name = itemNameInput.value.trim();
    const quantity = parseInt(quantityInput.value);

    errorMessage.textContent = '';

    if (quantity < 0) {
        errorMessage.textContent = 'Quantity cannot be negative.';
        return;
    }

    if (isDuplicate(name)) {
        errorMessage.textContent = 'Item already exists in inventory.';
        return;
    }

    inventory.push({ name, quantity });
    saveInventory();
    renderInventory();
    form.reset();
});

renderInventory();
</script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</body>
</html>
