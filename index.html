<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Inventory Command Center</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin:0;
    font-family: Arial, sans-serif;
    background-color:#1f2937;
    color:#f9fafb;
}

nav {
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.container{
    width:80%;
    margin:auto;
    padding:20px;
}

input{
    padding:8px;
    margin:5px;
}

button{
    padding:8px 12px;
    margin:5px;
    cursor:pointer;
}

ul{
    list-style:none;
    padding:0;
}

li{
    padding:6px 0;
}

canvas{
    margin-top:20px;
}

</style>
</head>

<body>

<nav>
<h2>ABC Logistics</h2>
<div>
<a href="index.html">Dashboard</a>
<a href="about.html">Developer Profile</a>
</div>
</nav>

<div class="container">

<h2>Inventory Dashboard</h2>

<form id="inventoryForm">

<input type="text" id="itemName" placeholder="Item Name" required>

<input type="number" id="itemQuantity" placeholder="Quantity" required>

<button type="submit">Add Item</button>

<button type="button" onclick="clearInventory()">Clear All</button>

</form>

<p id="errorMessage" style="color:red;"></p>

<h3>Inventory List</h3>

<ul id="inventoryList"></ul>

<button onclick="toggleChart()">Toggle Chart (Bar / Pie)</button>

<canvas id="inventoryChart"></canvas>

</div>

<script>

let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

let chartType = "bar";
let chart;

const form = document.getElementById("inventoryForm");
const list = document.getElementById("inventoryList");
const errorMessage = document.getElementById("errorMessage");

function saveInventory(){
    localStorage.setItem("inventory", JSON.stringify(inventory));
}

function isDuplicate(name){
    return inventory.some(item => item.name.toLowerCase() === name.toLowerCase());
}

form.addEventListener("submit", function(e){

e.preventDefault();

const name = document.getElementById("itemName").value.trim();
const quantity = Number(document.getElementById("itemQuantity").value);

errorMessage.textContent="";

if(quantity < 0){
    errorMessage.textContent="Quantity cannot be negative.";
    return;
}

if(isDuplicate(name)){
    errorMessage.textContent="Item already exists in inventory.";
    return;
}

inventory.push({name, quantity});

saveInventory();
renderInventory();

form.reset();

});

function renderInventory(){

list.innerHTML="";

inventory.forEach(item=>{

const li = document.createElement("li");

li.textContent = `${item.name} : ${item.quantity}`;

list.appendChild(li);

});

renderChart();

}

function renderChart(){

const labels = inventory.map(item=>item.name);
const data = inventory.map(item=>item.quantity);

const ctx = document.getElementById("inventoryChart");

if(chart){
    chart.destroy();
}

chart = new Chart(ctx, {

type: chartType,

data:{
labels:labels,
datasets:[{
label:"Inventory Quantity",
data:data,
backgroundColor:[
"#3b82f6",
"#10b981",
"#f59e0b",
"#ef4444",
"#8b5cf6",
"#ec4899"
]
}]
}

});

}

function toggleChart(){

if(chartType === "bar"){
chartType = "pie";
}else{
chartType = "bar";
}

renderChart();

}

function clearInventory(){

inventory = [];
localStorage.removeItem("inventory");

renderInventory();

}

renderInventory();

</script>

</body>
</html>
